databases:
  - name: investnaira-db
    databaseName: investnaira
    user: investnaira
    plan: free

services:
  - type: web
    name: investnaira-backend
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn investnaira.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.0
      - key: DEBUG
        value: false
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: investnaira-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: "*"
      - key: USE_SQLITE
        value: "0"
